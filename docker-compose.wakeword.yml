services:
  ava-wakeword:
    image: rhasspy/wyoming-openwakeword:2.1.0
    container_name: ava-wakeword
    restart: unless-stopped
    ports:
      - "127.0.0.1:10400:10400"
    volumes:
      - ./models/wakeword:/custom:ro
    command:
      - --uri
      - tcp://0.0.0.0:10400
      - --custom-model-dir
      - /custom
